<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ember Smoke & Flavor — Menu</title>
<meta name="description" content="Ember Smoke & Flavor: wood-fired, slow-smoked whole chicken in Erbil, Kurdistan. Original BBQ, Ember White, and Ember Heat sauces, served with signature red vegetable rice and Ember smoked vegetables.">
<style>
  :root {
    --steel: #14110e;
    --bronze: #3a2418;
    --gold: #c9a668;
    --ember: #b8451f;
    --cream: #f5efe4;
    --cream-dim: #e8dfcc;
    --ink: #211b16;
    --ink-soft: #6b5f52;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Georgia', 'Times New Roman', serif;
    line-height: 1.5;
  }

  body[dir="rtl"] {
    font-family: 'Tahoma', 'Arial', sans-serif;
  }

  /* ===== LANGUAGE SELECTOR ===== */
  .lang-bar {
    background: var(--steel);
    display: flex;
    justify-content: center;
    gap: 2px;
    padding: 10px;
  }

  .lang-btn {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: Georgia, serif;
    font-size: 13px;
    padding: 6px 16px;
    border-radius: 3px;
    cursor: pointer;
  }

  .lang-btn.active {
    background: var(--gold);
    color: var(--steel);
    font-weight: bold;
  }

  /* ===== HERO ===== */
  .hero {
    position: relative;
    height: 320px;
    overflow: hidden;
    background: var(--steel);
  }

  .hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.55;
  }

  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(20,17,14,0.2) 0%, rgba(20,17,14,0.75) 70%, rgba(20,17,14,0.95) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding: 28px 24px 26px;
    text-align: center;
  }

  .hero-mark {
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--gold);
    margin-bottom: 10px;
  }

  .hero h1 {
    font-size: 36px;
    color: var(--cream);
    letter-spacing: 0.5px;
    line-height: 1.15;
  }

  body[dir="rtl"] .hero h1 {
    font-size: 30px;
  }

  .hero p {
    color: var(--gold);
    font-size: 14px;
    font-style: italic;
    margin-top: 8px;
  }

  body[dir="rtl"] .hero p {
    font-style: normal;
  }

  /* ===== MAIN ===== */
  main {
    max-width: 700px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  .intro {
    margin-top: 30px;
    padding: 18px 20px;
    background: var(--cream-dim);
    border-radius: 4px;
    font-size: 14px;
    color: var(--ink-soft);
    font-style: italic;
    line-height: 1.6;
  }

  body[dir="rtl"] .intro {
    font-style: normal;
  }

  .section {
    margin-top: 40px;
  }

  .section-head h2 {
    font-size: 21px;
    color: var(--steel);
    letter-spacing: 0.3px;
  }

  .section-sub {
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
    margin: 4px 0 16px 0;
  }

  body[dir="rtl"] .section-sub {
    font-style: normal;
  }

  .section-line {
    height: 1px;
    background: linear-gradient(90deg, var(--ember) 0%, var(--cream-dim) 40%);
    margin: 8px 0 18px 0;
  }

  body[dir="rtl"] .section-line {
    background: linear-gradient(270deg, var(--ember) 0%, var(--cream-dim) 40%);
  }

  /* ===== ITEMS ===== */
  .item {
    display: flex;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid var(--cream-dim);
  }

  .item:last-child { border-bottom: none; }

  .item-photo {
    width: 88px;
    height: 88px;
    border-radius: 4px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--cream-dim);
    border: 1px solid var(--cream-dim);
  }

  .item-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }

  .item-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }

  .item-name {
    font-size: 16px;
    font-weight: bold;
    color: var(--steel);
  }

  .item-price {
    font-size: 15.5px;
    font-weight: bold;
    color: var(--ember);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .item-desc {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 4px;
    font-style: italic;
    line-height: 1.45;
  }

  body[dir="rtl"] .item-desc {
    font-style: normal;
  }

  footer {
    text-align: center;
    margin-top: 50px;
    padding: 26px 20px 0;
    border-top: 2px solid var(--steel);
    color: var(--ink-soft);
    font-size: 13px;
  }

  footer .brand {
    font-family: Georgia, serif;
    color: var(--steel);
    font-size: 16px;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  [data-lang] { display: none; }
  [data-lang].active { display: block; }
  span[data-lang].active { display: inline; }
</style>
</head>
<body dir="ltr" data-current-lang="en">

  <button class="lang-btn active" data-select-lang="en">English</button>
  <button class="lang-btn" data-select-lang="ku">کوردی</button>
  <button class="lang-btn" data-select-lang="ar">العربية</button>
</div>
